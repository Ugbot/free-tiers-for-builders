name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: dry runs print and touch nothing
        run: |
          set -euo pipefail
          for f in $(git ls-files '*/*.sh' | grep -v -e '/env.sh$' -e '^scripts/'); do
            bash "$f" --help >/dev/null
          done
          bash aiven/power.sh on example-service
          bash cloudflare/teardown.sh
          bash oracle-cloud/teardown.sh
          bash cloudflare/r2-budget-check.sh --planned-bytes 10 --used-bytes 20 --budget-bytes 100
          if bash cloudflare/r2-budget-check.sh --planned-bytes 90 --used-bytes 20 --budget-bytes 100; then
            echo "budget check should have refused" >&2; exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secret scan (tree and history)
        run: bash scripts/secret-scan.sh --history
